name: Предложение функции
description: Предложите новую функцию или улучшение
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за предложение! Расскажите о вашей идее.

  - type: textarea
    id: problem
    attributes:
      label: Проблема
      description: Какую проблему решает ваша функция
      placeholder: Я всегда раздражаюсь, когда...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Решение
      description: Как вы представляете решение
      placeholder: Я хотел бы, чтобы расширение...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Какие есть альтернативные решения

  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
      description: Скриншоты, примеры, ссылки
