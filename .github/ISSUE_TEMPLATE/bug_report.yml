name: Сообщение об ошибке
description: Сообщите об ошибке в работе расширения
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение! Пожалуйста, заполните форму подробно.

  - type: textarea
    id: description
    attributes:
      label: Описание ошибки
      description: Краткое описание проблемы
      placeholder: Что произошло? Что вы ожидали?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Как воспроизвести ошибку
      placeholder: |
        1. Открыть страницу...
        2. Нажать кнопку...
        3. Произошло...
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL страницы
      description: Ссылка на страницу где произошла ошибка
      placeholder: https://www.antonov.media/watch?v=...

  - type: textarea
    id: console
    attributes:
      label: Консоль (DevTools)
      description: Ошибки из консоли (F12 → Console)
      render: shell

  - type: input
    id: version
    attributes:
      label: Версия расширения
      description: Посмотрите в chrome://extensions или в manifest.json
      placeholder: "1.1"

  - type: input
    id: chrome
    attributes:
      label: Версия Chrome
      description: chrome://version
      placeholder: "120.0.xxxx.xx"

  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - Windows 10/11
        - macOS
        - Linux
        - Другая
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Проверка
      options:
        - label: Я проверил, что видео загружается в плеере
          required: true
        - label: Я обновил расширение до последней версии
          required: true
